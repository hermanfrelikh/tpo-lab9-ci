name: Run tests

# когда запускать: при каждом push и pull request, плюс вручную кнопкой в GitHub
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # ОС виртуальной машины GitHub: последняя Ubuntu (в ней уже есть Google Chrome)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Получить код из репозитория
        uses: actions/checkout@v5

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запустить тесты
        run: pytest -v --junitxml=report.xml

      - name: Сохранить отчёт pytest
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.xml
