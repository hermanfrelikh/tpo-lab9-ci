<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Обратная связь</h1>

        {% if success %}
        <div id="success" class="success">{{ success }}</div>
        {% endif %}

        <form id="contact-form" method="post" action="/contact" novalidate>
            <label for="name">Имя *</label>
            <input type="text" id="name" name="name" value="{{ form.name }}">
            {% if errors.name %}<div id="name-error" class="field-error">{{ errors.name }}</div>{% endif %}

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" value="{{ form.email }}">
            {% if errors.email %}<div id="email-error" class="field-error">{{ errors.email }}</div>{% endif %}

            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" value="{{ form.phone }}" placeholder="+7 999 123-45-67">
            {% if errors.phone %}<div id="phone-error" class="field-error">{{ errors.phone }}</div>{% endif %}

            <label for="topic">Тема</label>
            <select id="topic" name="topic">
                {% for t in ["Вопрос", "Предложение", "Жалоба"] %}
                <option {% if form.topic == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>

            <label for="message">Сообщение *</label>
            <textarea id="message" name="message" rows="4">{{ form.message }}</textarea>
            {% if errors.message %}<div id="message-error" class="field-error">{{ errors.message }}</div>{% endif %}

            <button type="submit" id="submit-button">Отправить</button>
        </form>
    </div>
</body>
</html>
